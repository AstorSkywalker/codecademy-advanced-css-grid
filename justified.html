<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Items Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <h1>Justify Items Example</h1>
        <p>This page shows how narrower grid items align to the start edge of each column.</p>
        <nav class="page-nav" aria-label="Page navigation">
            <a href="index.html">Back to Main Grid Examples</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="demo-section" aria-labelledby="justify-demo-title">
            <div class="section-heading">
                <h2 id="justify-demo-title">Start-Aligned Items</h2>
                <p>Each item is intentionally narrower than its column so the effect of `justify-items: start` is easy to see.</p>
            </div>
            <div class="justified-container">
                <div class="item item-9">Item 9</div>
                <div class="item item-10">Item 10</div>
                <div class="item item-11">Item 11</div>
            </div>
        </section>
    </main>
</body>
</html>
